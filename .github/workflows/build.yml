name: Build LiquidMagnifier

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  SDK_DIR: /tmp/sdks
  THEOS_DIR: /tmp/theos
  LDID: /tmp/ldid/ldid

jobs:
  build:
    name: Build packages (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld make perl dpkg xz-utils libplist-dev libssl-dev g++ git

      - name: Fetch iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_DIR"
          git -C "$SDK_DIR" sparse-checkout set iPhoneOS16.5.sdk
          test -d "$SDK_DIR/iPhoneOS16.5.sdk"

      - name: Fetch Theos logos + headers
        run: |
          git clone --depth 1 https://github.com/roothide/theos.git "$THEOS_DIR"
          git -C "$THEOS_DIR" submodule update --init --depth 1 vendor/logos vendor/include

      - name: Build ldid
        run: make -C /tmp/ldid -j"$(nproc)" || (git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid && make -C /tmp/ldid -j"$(nproc)")

      - name: Build debs
        run: |
          VERSION="5.2.0-${{ github.run_number }}" sh build_linux.sh
          ls -l packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v5.2.0-${{ github.run_number }}
          name: "液态放大镜 v5.2.0-${{ github.run_number }}"
          files: ./packages/*.deb
